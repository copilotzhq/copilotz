name: Validate and Publish

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: copilotz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  deno-postgres:
    if: github.ref == 'refs/heads/main'
    name: Deno, PGlite, and PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: copilotz_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d copilotz_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COPILOTZ_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/copilotz_test
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2
          cache: true
          cache-hash: ${{ hashFiles('deno.json', 'dependencies/*.ts') }}
      - name: Architecture and package-surface checks
        run: deno task check
      - name: Complete retained suite with PostgreSQL
        run: deno task test

  runtimes:
    if: github.ref == 'refs/heads/main'
    name: Deno, Node, Bun, and browser isolate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2
          cache: true
          cache-hash: ${{ hashFiles('deno.json', 'dependencies/*.ts') }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: deno task smoke:authoring
      - run: deno task bundle:runtime-smoke
      - run: deno task smoke:deno
      - run: deno task smoke:node
      - run: deno task smoke:bun
      - run: deno task smoke:browser

  cloudflare:
    if: github.ref == 'refs/heads/main'
    name: Cloudflare Worker isolate and dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2
          cache: true
          cache-hash: ${{ hashFiles('deno.json', 'dependencies/*.ts') }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - run: deno task bundle:edge-smoke
      - run: deno task smoke:cloudflare
      - run: deno task smoke:cloudflare-build

  package:
    if: github.ref == 'refs/heads/main'
    name: Formatting and JSR dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2
          cache: true
          cache-hash: ${{ hashFiles('deno.json', 'dependencies/*.ts') }}
      - run: deno fmt --check
      - run: deno task publish:dry-run

  publish:
    name: Publish to JSR
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [deno-postgres, runtimes, cloudflare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2
      - name: Validate release tag
        run: >-
          deno run --allow-read=deno.json scripts/validate_publish_release.ts
          "${{ github.ref_name }}" "${{ github.ref }}"
      - name: Require successful checks for this exact main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100" \
            | jq --exit-status --arg sha "$GITHUB_SHA" \
              'any(.workflow_runs[]; .head_sha == $sha and .head_branch == "main" and .status == "completed" and .conclusion == "success")'
      - run: deno publish
