# The same suite on every runtime Copilotz supports, against PostgreSQL (with
# pgvector), PGlite, SQLite and memory stores; Node's also on macOS and Windows,
# where the computer program runs too. It runs when the publish workflow calls
# it, before a release, and on demand (Actions → Test → Run workflow): not on
# pushes or pull requests. A release whose tests fail publishes nothing; it's
# fixed forward and tagged again. Run what a change touches locally before
# merging it.
name: Test

on:
  workflow_call:
  workflow_dispatch:

# A newer run for the same ref cancels the one before it. Release runs (a tag, through the
# publish workflow) each have their own tag, so nothing cancels them.
concurrency:
  group: test-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, node, bun]
    runs-on: ubuntu-latest
    # A test that hangs fails here, instead of holding a runner for GitHub's 6 hours.
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: copilotz_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COPILOTZ_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/copilotz_test
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x
      # Every runtime gets node_modules: the Node web host's tests bundle with esbuild, which reads it.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
      - run: npm ci
      - name: Format, types, tests, and the JSR packages
        if: matrix.runtime == 'deno'
        run: |
          deno fmt --check
          deno task check
          deno task test
          deno publish --dry-run
          for dir in packages/*/; do (cd "$dir" && deno publish --dry-run); done
      - name: Tests, and the npm packages (built, installed together from their tarballs, used)
        if: matrix.runtime == 'node'
        run: |
          npm test
          npm run build
          node scripts/npm/smoke.ts
      - run: bun test --timeout 60000
        if: matrix.runtime == 'bun'

  # Node on the desktops people run the computer program on. GitHub runs service
  # containers on Linux only, so these run without PostgreSQL (its tests skip).
  node:
    name: node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
        if: runner.os != 'Windows'
      # Every test file but these, which can't run on Windows yet. Each finds files by
      # `new URL(…, import.meta.url).pathname`, which is "/D:/…" there, not a path:
      # `fileURLToPath` fixes it, and then its line goes.
      # - testing/boundaries.test.ts, testing/styles.test.ts: the tree they read;
      # - runtime/tests/runtime.test.ts: the remote executor it starts (one test of many).
      # The computer program's tests mark what's POSIX-only themselves.
      - name: npm test, on Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          NOT_YET: |
            testing/boundaries.test.ts
            testing/styles.test.ts
            runtime/tests/runtime.test.ts
        run: |
          files=$(git ls-files '*.test.ts' | grep -vxF -f <(printf '%s\n' "$NOT_YET" | sed '/^$/d'))
          node --test --test-concurrency=1 $files
